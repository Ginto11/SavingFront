<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SavingFront - Gestión y control de ahorro.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ICONO DE LA APP -->
  <link rel="icon" type="image/x-icon" href="images/salario.png">
  <!-- DESCRIPCION DE LA APP -->
  <meta name="description" content="Aplicación Front-Ent desarrollada en angular para la gestión de ahorro de efectivo. Cuenta con metas de ahorro, roles para temas de autenticación y autorización.">
  <!-- AUTOR DE LA APP -->
  <meta name="author" content="Dev Studio MZ - SavingFront">
  <!-- NOMBRE DE QUIEN LA PUBLICA -->
  <meta name="publisher" content="SavingFront">
  <!-- PALABRAS CLAVE -->
  <meta name="keywords" content="Ahorro, Saving, Dev Studio MZ, Aplicación de ahorros, Web de ahorros, Gestion de ahorros, SavingFront, Manejo de gastose ingresos">
  <!-- LE DICE A GOOGLE COMO TRATAR EL SITIO (INDEX = SE PUEDE INDEXAR EN GOOGLE Y FOLLOW = LOS ENLACES SI SE RASTREAN) -->
  <meta name="robots" content="index, follow">
  <!-- URL PRINCIPAL DEL SITIO -->
  <link rel="canonical" href="https://saving-front.vercel.app/inicio"> 
  <!-- VERIFICACION DE GOOGLE SEARCH -->
  <meta name="google-site-verification" content="WhQNLZ79fbMl9W8r5XEX_2gAOBPUWHAca-WNpuG3vrM" />
  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <meta property="og:type" content="website"/>
  <meta property="og:title" content="SavingFront - Gestión y control de ahorro."/>
  <meta property="og:description" content="Lleva el control total de tu dinero: registra ingresos, administra gastos y alcanza tus metas de ahorro de manera simple e inteligente.">
  <meta property="og:image" content="https://saving-front.vercel.app/images/imagen-inicio.png" />
  <meta property="og:url" content="https://saving-front.vercel.app" />
  <script>
    // On page load or when changing themes, best to add inline in `head` to avoid FOUC
      if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
      } else {
          document.documentElement.classList.remove('dark')
      }
  </script>
</head>
<body class="bg-white dark:bg-gray-900">
  <app-root></app-root>
</body>
</html>
